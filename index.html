<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>반짝이네 삼촌 | 문의 관리자</title><style>body{margin:0;background:#f5f7f5;color:#182b1f;font-family:system-ui,-apple-system,sans-serif}header{padding:24px 5%;background:#173b2b;color:white}main{max-width:1150px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #e0e8e1;border-radius:16px;padding:24px;margin:16px 0}input,button{padding:12px;border:1px solid #d4ddd6;border-radius:9px;font:inherit}button{background:#176b35;color:white;cursor:pointer}button.secondary{background:white;color:#176b35}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e9eee9;text-align:left;padding:12px 9px;vertical-align:top}th{color:#53695b} .scroll{overflow:auto}small{color:#69766d}.pill{padding:4px 8px;border-radius:99px;background:#edf5ee}#app{display:none}#message{color:#b44}a{color:#176b35}@media(max-width:700px){header{padding:18px}main{margin:16px auto}.card{padding:15px}}</style></head><body><header><strong>반짝이네 삼촌</strong>　/　고객 문의 관리자</header><main><section class="card" id="login"><h2>관리자 로그인</h2><p><small>Supabase Auth 계정과 admin_users 등록이 필요합니다.</small></p><form id="loginForm" class="row"><input id="email" type="email" placeholder="관리자 이메일" required><input id="password" type="password" placeholder="비밀번호" required><button>로그인</button></form><p id="message" role="status"></p></section><section id="app"><div class="row"><h2 style="flex:1">견적 문의 내역</h2><button id="refresh">새로고침</button><button class="secondary" id="csv">CSV 다운로드</button><button class="secondary" id="logout">로그아웃</button></div><div class="card"><div class="row"><input id="search" placeholder="고객명 / 연락처 / 서비스 검색" style="flex:1"><label><input id="marketingOnly" type="checkbox"> 마케팅 동의 고객만</label></div><p id="count"></p><div class="scroll"><table><thead><tr><th>접수일</th><th>고객명</th><th>연락처</th><th>서비스</th><th>희망일</th><th>필수 동의</th><th>마케팅 동의</th><th>동의 기록 시각</th><th>동의 버전</th><th>문의 경로</th><th>요청 사항</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>
// GitHub Pages 업로드 전 두 값을 index.html과 동일하게 입력하세요.
const SUPABASE_URL='';const SUPABASE_ANON_KEY='';
let token='',data=[];const $=id=>document.getElementById(id);const endpoint=()=>SUPABASE_URL.replace(/\/$/,'');
async function api(path,opts={}){const r=await fetch(endpoint()+path,{...opts,headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+(token||SUPABASE_ANON_KEY),'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw Error('요청 실패 '+r.status);return r.json()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('message').textContent='로그인 중…';try{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=r.access_token;await load();$('login').style.display='none';$('app').style.display='block';$('message').textContent=''}catch(err){token='';$('message').textContent='로그인 또는 관리자 권한을 확인해 주세요. '+err.message}};
async function load(){data=await api('/rest/v1/cleaning_inquiries?select=*&order=created_at.desc&limit=1000');render()}
function render(){const q=$('search').value.toLowerCase();const filtered=data.filter(r=>(!$('marketingOnly').checked||r.marketing_agreed)&&[r.name,r.phone,r.service].some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent='조회 '+filtered.length+'건 (최대 최근 1,000건)';const body=$('rows');body.replaceChildren();for(const r of filtered){const tr=document.createElement('tr');const vals=[r.created_at,r.name,r.phone,r.service,r.requested_date,r.privacy_agreed?'동의':'미동의',r.marketing_agreed?'동의':'미동의',r.consent_recorded_at,r.consent_version,r.source,r.details];for(const v of vals){const td=document.createElement('td');td.textContent=v??'';tr.append(td)}body.append(tr)}}
$('search').oninput=render;$('marketingOnly').onchange=render;$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('logout').onclick=()=>{token='';data=[];$('app').style.display='none';$('login').style.display='block'};
$('csv').onclick=()=>{const keys=['created_at','name','phone','service','requested_date','area','size','source','details','privacy_agreed','marketing_agreed','consent_recorded_at','consent_version','attribution'];const csv=[keys.join(','),...data.map(r=>keys.map(k=>'"'+String(typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='inquiries.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
