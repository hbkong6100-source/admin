<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>반짝이네 삼촌 | 관리자</title><style>body{margin:0;background:#f5f7f5;color:#182b1f;font-family:system-ui,-apple-system,sans-serif}header{padding:24px 5%;background:#173b2b;color:white}main{max-width:1150px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #e0e8e1;border-radius:16px;padding:24px;margin:16px 0}input,button{padding:12px;border:1px solid #d4ddd6;border-radius:9px;font:inherit}button{background:#176b35;color:white;cursor:pointer}button.secondary{background:white;color:#176b35}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e9eee9;text-align:left;padding:12px 9px;vertical-align:top}td{white-space:pre-line;min-width:70px}th{color:#53695b} .scroll{overflow:auto}small{color:#69766d}.pill{padding:4px 8px;border-radius:99px;background:#edf5ee}#app{display:none}#message{color:#b44}a{color:#176b35}@media(max-width:700px){header{padding:18px}main{margin:16px auto}.card{padding:15px}}
.tabs{border-bottom:1px solid #dfe6df;margin-bottom:8px;padding-bottom:12px}.tabbtn{background:#fff;color:#3a4d40;border-color:#d4ddd6}.tabbtn.on{background:#176b35;color:#fff;border-color:#176b35}
[hidden]{display:none!important}button:disabled{opacity:.4;cursor:not-allowed}select,textarea{padding:12px;border:1px solid #d4ddd6;border-radius:9px;font:inherit;background:#fff}
.ed-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:8px;z-index:5;padding:14px 18px}
.ed-status{display:flex;flex-direction:column;font-size:13px;color:#5b6b60}.ed-status.dirty b{color:#b0392b}
.ed-wrap{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.ed-nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:96px}.ed-nav button{text-align:left;background:#fff;color:#2c3e32;border-color:#e0e8e1}.ed-group{font-size:11px;font-weight:800;letter-spacing:.08em;color:#7a887e;margin:10px 4px 0}.ed-nav button.on{background:#edf5ee;border-color:#176b35;color:#176b35;font-weight:700}
.ed-body h3{margin:0 0 4px;font-size:20px}.ed-desc{color:#5b6b60;font-size:14px;margin:0 0 20px}
.ed-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.ed-field>label{font-size:13px;font-weight:700}.ed-field em{color:#b0392b;font-style:normal}.ed-field small{font-size:12px}
.ed-field input:not([type=checkbox]),.ed-field textarea{width:100%;box-sizing:border-box}
.ed-toggle{flex-direction:row;align-items:center;gap:10px}.ed-toggle input{width:20px;height:20px;accent-color:#176b35}
.ed-listhd{margin:4px 0 8px;font-size:14px}.ed-list,.ed-quote{display:flex;flex-direction:column;gap:12px}
.ed-item{border:1px solid #e0e8e1;border-radius:12px;padding:14px 16px;background:#fbfcfb}.ed-item.off{opacity:.55;background:#f2f2f2}
.ed-itemhd{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}.ed-itemhd>span{width:26px;height:26px;border-radius:50%;background:#176b35;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-right:auto}
.ed-kind{font-size:12px;color:#5b6b60;margin-right:auto;margin-left:-4px}.ed-lock{font-size:12px;color:#5b6b60;padding:4px 8px;border-radius:99px;background:#edf5ee}
button.mini{padding:6px 10px;font-size:12px;background:#fff;color:#2c3e32;border-color:#d4ddd6}button.danger{color:#b0392b}button.ed-add{align-self:flex-start}
.ed-opts{border-top:1px dashed #d4ddd6;padding-top:10px}.ed-opt{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center}.ed-opt input:not([type=checkbox]){flex:1;min-width:120px;padding:9px 10px}.ed-opt select{padding:9px}.ed-none{font-size:12px;display:flex;gap:4px;align-items:center}
.ed-img{display:flex;flex-direction:column;gap:8px}.ed-img img,.ed-noimg{width:200px;height:140px;object-fit:cover;border-radius:10px;border:1px solid #e0e8e1}.ed-noimg{display:flex;align-items:center;justify-content:center;color:#8a968d;font-size:13px;background:#f3f6f3}
.ed-msg{position:sticky;bottom:12px;background:#173b2b;color:#fff;border-radius:10px;padding:12px 16px;font-size:14px;margin:12px 0}.ed-msg:empty{display:none}.ed-msg.bad{background:#8f2b20}
.ed-modal{border:0;border-radius:16px;padding:20px;width:min(560px,94vw);max-height:90vh}.ed-modal.wide{width:min(1300px,96vw)}.ed-modal::backdrop{background:#0008}
.pv-frame iframe{width:100%;height:76vh;border:1px solid #e0e8e1;border-radius:10px;background:#fff}.pv-frame.mobile iframe{width:390px;display:block;margin:0 auto}
.ed-hist{display:flex;flex-direction:column;gap:8px}.ed-histrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e0e8e1;border-radius:10px;padding:10px 14px}.ed-histrow small{display:block}
@media(max-width:800px){.ed-wrap{grid-template-columns:1fr}.ed-nav{flex-direction:row;overflow:auto;position:static}.ed-nav button{white-space:nowrap}.ed-bar{position:static}}
</style></head><body><header><strong>반짝이네 삼촌</strong>　/　관리자</header><main><section class="card" id="login"><h2>관리자 로그인</h2><p><small>Supabase Auth 계정과 admin_users 등록이 필요합니다.</small></p><form id="loginForm" class="row"><input id="email" type="email" placeholder="관리자 이메일" required><input id="password" type="password" placeholder="비밀번호" required><button>로그인</button></form><p id="message" role="status"></p></section><section id="app"><div class="tabs row"><button type="button" class="tabbtn on" data-view="viewInquiries">견적 문의</button><button type="button" class="tabbtn" data-view="viewEditor">홈페이지 관리</button><span style="flex:1"></span><button class="secondary" id="logout">로그아웃</button></div><div id="viewInquiries"><div class="row"><h2 style="flex:1">견적 문의 내역</h2><button id="refresh">새로고침</button><button class="secondary" id="csv">CSV 다운로드</button></div><div class="card"><div class="row"><input id="search" placeholder="고객명 / 연락처 / 서비스 / 지역 검색" style="flex:1"><select id="group" style="padding:12px;border:1px solid #d4ddd6;border-radius:9px;font:inherit"><option value="">전체 서비스</option><option value="home">입주·이사·거주</option><option value="business">정기청소</option><option value="appliance">가전청소</option></select><label><input id="marketingOnly" type="checkbox"> 마케팅 동의 고객만</label></div><p id="count"></p><div class="scroll"><table><thead><tr><th>접수일</th><th>고객명</th><th>연락처</th><th>서비스</th><th>희망일</th><th>지역</th><th>면적·수량</th><th>추가 정보</th><th>요청 사항</th><th>문의 경로</th><th>유입(광고)</th><th>마케팅 동의</th><th>동의 기록</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div id="viewEditor" hidden></div></section></main><script>
'use strict';
// 공개용(publishable) 키만 사용합니다. 고객 정보는 Supabase RLS에 의해 admin_users에 등록된 관리자만 조회됩니다.
const SUPABASE_URL='https://wqojzrpsfjkecfybmuax.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_VmJzx86G5PeNmazwCRXWgQ_Wdgaz5EC';
const GROUPS={home:['입주청소','이사청소','거주청소'],business:['사무실 정기청소','상가 정기청소','병원·학원 청소','공용 계단 청소'],appliance:['에어컨 분해청소','냉장고 청소','세탁기 청소','건조기 청소','공기청정기 청소']};
const EXTRA_LABELS={business_type:'사업장',cleaning_cycle:'주기',model_name:'모델',install_env:'형태'};
let token='',data=[];const $=id=>document.getElementById(id);const endpoint=()=>SUPABASE_URL.replace(/\/$/,'');
async function api(path,opts={}){const r=await fetch(endpoint()+path,{...opts,headers:{apikey:SUPABASE_ANON_KEY,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json',...(opts.headers||{})}});
if(r.status===401&&token){showLogin('로그인 시간이 만료되었습니다. 다시 로그인해 주세요.');throw Error('세션 만료')}
if(!r.ok){const e=Error('요청 실패 '+r.status);e.status=r.status;throw e}const t=await r.text();return t?JSON.parse(t):null}
function showLogin(msg){const t0=document.querySelector('.tabbtn');if(t0&&!t0.classList.contains('on'))t0.click();token='';data=[];$('rows').replaceChildren();$('app').style.display='none';$('login').style.display='block';$('message').textContent=msg||''}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('message').textContent='로그인 중…';
try{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=r.access_token;$('password').value='';
const isAdmin=await api('/rest/v1/rpc/is_cleaning_admin',{method:'POST',body:'{}'});
if(isAdmin!==true){await logout();$('message').textContent='로그인은 되었지만 관리자로 등록되지 않은 계정입니다. 관리자 등록을 먼저 완료해 주세요.';return}
await load();$('login').style.display='none';$('app').style.display='block';$('message').textContent=''}
catch(err){if(err.message!=='세션 만료'){token='';$('message').textContent=err.status===400?'이메일 또는 비밀번호가 올바르지 않습니다.':'로그인하지 못했습니다. ('+err.message+')'}}};
async function load(){data=await api('/rest/v1/cleaning_inquiries?select=*&order=created_at.desc&limit=1000');render()}
const fmt=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
const extraText=r=>Object.entries(r.service_details||{}).map(([k,v])=>(EXTRA_LABELS[k]||k)+': '+v).join(' / ');
const inflowText=r=>{const a=r.attribution||{};return[a.utm_source,a.utm_medium,a.utm_campaign,a.n_keyword&&('키워드:'+a.n_keyword)].filter(Boolean).join(' · ')+(a.landing_page?' ('+a.landing_page+')':'')};
function render(){const q=$('search').value.trim().toLowerCase();const g=$('group').value;
const filtered=data.filter(r=>(!$('marketingOnly').checked||r.marketing_agreed)&&(!g||(GROUPS[g]||[]).includes(r.service))&&(!q||[r.name,r.phone,r.service,r.area].some(v=>String(v||'').toLowerCase().includes(q))));
$('count').textContent='조회 '+filtered.length+'건 / 전체 '+data.length+'건 (최근 1,000건까지)';const body=$('rows');body.replaceChildren();
for(const r of filtered){const tr=document.createElement('tr');const vals=[fmt(r.created_at),r.name,r.phone,r.service,r.requested_date,r.area,r.size,extraText(r),r.details,r.source,inflowText(r),r.marketing_agreed?'동의':'미동의',fmt(r.consent_recorded_at)+' · '+(r.consent_version||'')];
for(const v of vals){const td=document.createElement('td');td.textContent=v??'';tr.append(td)}body.append(tr)}}
async function logout(){if(window.resetContentEditor)window.resetContentEditor();try{if(token)await fetch(endpoint()+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+token}})}catch(e){}showLogin('')}
$('search').oninput=render;$('marketingOnly').onchange=render;$('group').onchange=render;$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('logout').onclick=()=>logout();
$('csv').onclick=()=>{const keys=['created_at','name','phone','service','requested_date','area','size','service_details','details','source','attribution','privacy_agreed','marketing_agreed','consent_recorded_at','consent_version','request_id'];
const cell=v=>{let s=String(v!==null&&typeof v==='object'?JSON.stringify(v):v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
const csv=[keys.join(','),...data.map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));a.download='inquiries-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};

document.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabbtn').forEach(x=>x.classList.toggle('on',x===b));$('viewInquiries').hidden=b.dataset.view!=='viewInquiries';$('viewEditor').hidden=b.dataset.view!=='viewEditor';if(b.dataset.view==='viewEditor'&&window.openContentEditor)window.openContentEditor()}));
</script><script src="../main/assets/content.js?v=2"></script><script src="editor.js?v=2"></script></body></html>
